name: netliquidity

on:
  schedule:
    - cron: '0 22 * * 5'   # Fridays 22:00 UTC, after the H.4.1 release
  workflow_dispatch:        # lets you trigger it manually to test

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch and append
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python fetch_netliquidity.py
      - name: Commit
        run: |
          git config user.name "netliquidity-bot"
          git config user.email "bot@users.noreply.github.com"
          git add netliquidity.csv
          git diff --staged --quiet || git commit -m "update $(date -u +%F)"
          git push
